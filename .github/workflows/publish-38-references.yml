name: Publish 38 formatted references
on:
  push:
    paths:
      - generate_38_references.py
      - .github/workflows/publish-38-references.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document library
        run: python -m pip install python-docx
      - name: Generate Word document
        run: python generate_38_references.py
      - name: Commit Word document to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ACS_References_38_Formatted.docx
          if ! git diff --cached --quiet; then
            git commit -m "Publish formatted 38-reference DOCX"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ACS_References_38_Formatted
          path: ACS_References_38_Formatted.docx
